<svg class="piq-svg piq-td" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 199.2" role="img" aria-label="Top-down court view"><style>
.piq-svg{font-family:"Barlow Semi Condensed", "Barlow", system-ui, sans-serif}
.piq-backdrop{fill:#1E2B38}
