<svg class="piq-svg piq-side" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" role="img" aria-label="Side view of ball height versus the net"><style>
.piq-svg{font-family:"Barlow Semi Condensed", "Barlow", system-ui, sans-serif}
.piq-backdrop{fill:#1E2B38}
