<svg class="piq-svg piq-td" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 213.6" role="img" aria-label="Top-down court view"><style>
.piq-svg{font-family:"Barlow Semi Condensed", "Barlow", system-ui, sans-serif}
.piq-backdrop{fill:#1E2B38}
.piq-surround{fill:#3B6D57}
.piq-surface{fill:#2D5F8E}
.piq-kitchen{fill:#27527D}
.piq-line{fill:#EEF3EF;stroke:#EEF3EF;stroke-width:.6}
.piq-td-line{stroke:#EEF3EF;fill:none}
.piq-net-mesh{fill:rgba(12, 18, 24, 0.42)}
.piq-net-tape{fill:#F4F6F4}
.piq-net-post{stroke:#12171D;stroke-linecap:round}
.piq-td-net{stroke:#F4F6F4;stroke-linecap:round}
.piq-player-us{fill:#F3F2EC;stroke:#1B2A3A;stroke-width:.8}
.piq-player-them{fill:#E8703E;stroke:#5E2410;stroke-width:.8}
.piq-arm-us{stroke:#F3F2EC;fill:none}
.piq-arm-them{stroke:#E8703E;fill:none}
.piq-label-us{fill:#1B2A3A;font-weight:600;font-size:12px}
.piq-label-them{fill:#3B1405;font-weight:600;font-size:12px}
.piq-paddle{fill:#12171D}
.piq-ball{fill:#D9F03E;stroke:#3D4806;stroke-width:.8}
.piq-ball-shadow{fill:rgba(0, 0, 0, 0.38)}
.piq-stalk{stroke:rgba(255, 255, 255, 0.8);stroke-width:1.2;stroke-dasharray:3 3;fill:none}
.piq-tick{stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:round}
.piq-path{stroke:#F5C443;fill:none;stroke-linecap:round}
.piq-path-far{stroke-dasharray:5 4}
.piq-answer{stroke:#5FE3A8;fill:none;stroke-width:3;stroke-linecap:round}
.piq-answer-zone{fill:rgba(95, 227, 168, 0.3);stroke:#5FE3A8;stroke-width:1.2;stroke-dasharray:4 3}
.piq-arrowhead{fill:#5FE3A8}
.piq-fov{fill:rgba(255, 255, 255, 0.2)}
.piq-cam{fill:#FFFFFF;stroke:#1E2B38;stroke-width:1}
.piq-annot{fill:#EEF3EF;font-weight:600;font-size:11px}
.piq-annot-line{stroke:#EEF3EF;fill:none}
.piq-reveal{opacity:0;transition:opacity .25s ease}
.is-revealed .piq-reveal,.piq-reveal.is-on{opacity:1}
@media (prefers-reduced-motion: reduce){.piq-reveal{transition:none}}
