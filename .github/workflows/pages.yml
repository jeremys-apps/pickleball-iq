# Publishes app/ to GitHub Pages. Settings, Pages, Source: GitHub Actions.
# Action versions were current when written; bump them to the latest majors.
name: Deploy app

on:
  push:
    branches: [main]
    paths: ["app/**", "tools/gen-sw-manifest.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse to publish anything but the sample deck
        run: |
          extra=$(ls app/data | grep -v '^deck.sample.json$' || true)
          if [ -n "$extra" ]; then echo "Unexpected files in app/data: $extra"; exit 1; fi
      - run: npm ci || npm install
      - run: npm test
      - run: node tools/gen-sw-manifest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
